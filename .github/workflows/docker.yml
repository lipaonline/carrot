name: Docker Build and Push

on:
  push:
    branches:
      - main

# Public deployment URLs, baked into the web build (not secrets — they are
# visible in the shipped JS anyway). Update these if the Bunny URLs change.
env:
  BACKEND_URL: https://mc-xhcmvvio1b.bunny.run
  WEB_APP_URL: https://mc-ivyvxr78cn.bunny.run

jobs:
  build-and-push-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ./potato_app
        run: flutter pub get

      - name: Build Web
        working-directory: ./potato_app
        run: flutter build web --release --dart-define=BACKEND_URL=$BACKEND_URL --dart-define=WEB_APP_URL=$WEB_APP_URL

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push web image
        working-directory: ./potato_app
        run: |
          docker build --platform linux/amd64 -t ghcr.io/lipaonline/carrot-web:latest .
          docker push ghcr.io/lipaonline/carrot-web:latest

  build-and-push-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push server image
        working-directory: ./potato_server
        run: |
          docker build --platform linux/amd64 -t ghcr.io/lipaonline/carrot-server:latest .
          docker push ghcr.io/lipaonline/carrot-server:latest
