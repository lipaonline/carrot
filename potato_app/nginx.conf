server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # These entry files are NOT content-hashed, so caching them long makes new
    # deploys invisible. Force revalidation (via ETag) so updates propagate.
    location = /index.html              { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js    { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /version.json            { add_header Cache-Control "no-cache"; }
    location = /main.dart.js            { add_header Cache-Control "no-cache"; }
    location = /flutter.js              { add_header Cache-Control "no-cache"; }

    # Flutter web uses path-based routing; serve index.html for unknown paths
    # so a refresh on a deep link doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
